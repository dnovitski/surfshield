[package]
name = "surfshield"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
encoding_rs = "0.8.42"
futures-util = "0.3.34"
hex = "0.4.3"
htmd = "0.5.5"
ipnet = "2.12.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "http2", "charset", "gzip", "brotli", "deflate", "socks"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
